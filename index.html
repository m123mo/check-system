<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ULTIMATE RECON SYSTEM v16.0</title>
    <style>
        :root { --neon: #00f2ff; --danger: #ff003c; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Consolas', monospace; margin: 0; overflow: hidden; }
        .header { background: #111; padding: 15px; border-bottom: 2px solid var(--neon); display: flex; gap: 10px; }
        input { flex: 1; background: #000; border: 1px solid var(--neon); padding: 12px; color: var(--neon); outline: none; }
        button { background: var(--neon); color: #000; border: none; padding: 12px 25px; font-weight: 900; cursor: pointer; }
        .main-container { display: grid; grid-template-columns: 350px 1fr; height: calc(100vh - 75px); }
        .side-panel { background: #0a0a0a; border-left: 1px solid #333; padding: 15px; overflow-y: auto; }
        .viewport { background: #fff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .badge { padding: 5px; font-size: 11px; font-weight: bold; border: 1px solid; margin-bottom: 10px; display: block; text-align: center; }
        pre { background: #000; color: #0f0; padding: 10px; border: 1px solid #222; max-height: 400px; overflow: auto; font-size: 11px; }
    </style>
</head>
<body>

<div class="header">
    <input type="text" id="targetUrl" placeholder="أدخل الرابط كاملاً">
    <button onclick="startInfiltration()">EXECUTE SCAN</button>
</div>

<div class="main-container">
    <div class="side-panel">
        <div id="status" class="badge" style="color: #aaa; border-color: #444;">IDLE_WAITING</div>
        <div id="stats" style="font-size: 12px; color: #888;">Scripts: 0 | Images: 0 | Links: 0</div>
        <pre id="rawSource">// No data</pre>
    </div>
    <div class="viewport" id="vPort"></div>
</div>

<script>
async function startInfiltration() {
    let url = document.getElementById('targetUrl').value.trim();
    if(!url) return alert("أدخل الرابط!");

    document.getElementById('status').innerText = "PYTHON_SCANNING...";
    
    try {
        // نرسل الطلب لسيرفر البايثون (Flask)
        const response = await fetch('/api/scan', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({url: url})
        });

        const data = await response.json();
        
        document.getElementById('stats').innerHTML = 
            `Scripts: ${data.stats.scripts} | Images: ${data.stats.images} | Links: ${data.stats.links}`;
        document.getElementById('rawSource').innerText = data.html;
        
        const vPort = document.getElementById('vPort');
        vPort.innerHTML = `<iframe id="reconFrame"></iframe>`;
        const doc = document.getElementById('reconFrame').contentWindow.document;
        doc.open();
        // حقن base tag ليتم تحميل الصور بشكل صحيح من السيرفر الأصلي
        doc.write(`<base href="${data.base_url}/">` + data.html);
        doc.close();

        document.getElementById('status').innerText = "SUCCESS";
    } catch (e) {
        document.getElementById('status').innerText = "ERROR";
    }
}
</script>
</body>
</html>
